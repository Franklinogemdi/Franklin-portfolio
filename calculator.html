<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: lightblue;
        text-align: center;
        padding: 30px;
    }

    h1 {
        color: darkblue;
    }

    #display {
        width: 280px;
        padding: 15px;
        margin: 20px auto;
        display: block;
        font-size: 24px;
        text-align: right;
        border: 2px solid darkblue;
        border-radius: 10px;
        box-sizing: border-box;
        background-color: white;
    }

    button {
        width: 60px;
        height: 60px;
        margin: 5px;
        border: none;
        border-radius: 10px;
        background-color: darkblue;
        color: white;
        font-size: 20px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        background-color: blue;
    }
</style>
</head>

<body>

    <h1>My Calculator</h1>
    <a href="index.html">← Back to Portfolio</a>
    <input type="text" id="display" readonly>
    <div>
    <button>7</button>
    <button>8</button>
    <button>9</button>
    <button>÷</button>
</div>

<div>
    <button>4</button>
    <button>5</button>
    <button>6</button>
    <button>×</button>
</div>

<div>
    <button>1</button>
    <button>2</button>
    <button>3</button>
    <button>-</button>
</div>

<div>
    <button>0</button>
    <button>.</button>
    <button>+</button>
    <button>=</button>
</div>

<div>
    <button>C</button>
    <button>⌫</button>
</div>
<script>
    let display = document.getElementById("display");

    let buttons = document.querySelectorAll("button");

    buttons.forEach(function(button) {
        button.addEventListener("click", function() {

            let value = button.innerText;

if (value === "C") {
    display.value = "";
}

else if (value === "⌫") {
    display.value = display.value.slice(0, -1);
}

            else if (value === "=") {
                try {
                    let calculation = display.value
                        .replace(/×/g, "*")
                        .replace(/÷/g, "/");

                    display.value = eval(calculation);
                } catch {
                    display.value = "Error";
                }
            }

            else {
                display.value += value;
            }

        });
    });
</script>

</body>
</html>
